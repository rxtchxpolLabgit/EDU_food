name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create runtime API configuration
        working-directory: frontend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e 'const fs=require("node:fs"); const apiBaseUrl=(process.env.API_BASE_URL||"").trim().replace(/\/+$/,""); fs.writeFileSync("public/runtime-config.js", `window.EDU_FOOD_CONFIG = ${JSON.stringify({apiBaseUrl})};\n`);'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Build site for project Pages URL
        working-directory: frontend
        run: npm run build -- --base-href /EDU_food/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
