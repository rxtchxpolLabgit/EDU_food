name: Build Docker images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate production Compose configuration
        env:
          DB_PASSWORD: local-ci-only-db-password
          JWT_SECRET: local-ci-only-jwt-secret-0123456789abcdef0123456789abcdef
          ADMIN_DEFAULT_PASSWORD: local-ci-only-admin-password
          DOMAIN: example.com
          CORS_ORIGIN: https://example.com
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build app images
        run: docker compose -f docker-compose.prod.yml build backend frontend
